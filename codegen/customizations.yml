---
customizations:
  client:
    imports:
      - "io"
    excludeResources:
      - "DescribedFeature"
      - "Dpi*"
      - "FirewallZoneMatrix"
    functions:
      - name: "Login"
        comment: "Login logs in to the controller. Useful only for user/password authentication."
        returns:
          - "error"
      - name: "Logout"
        comment: "Logout logs out from the controller."
        returns:
          - "error"
      - name: "BaseURL"
        comment: "BaseURL returns the base URL of the controller."
        returns:
          - "string"
      - name: "Version"
        comment: "Version returns the version of the UniFi Controller API."
        returns:
          - "string"
      - name: "Do"
        comment: "Do sends a request to the controller."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "method"
            type: "string"
          - name: "apiPath"
            type: "string"
          - name: "reqBody"
            type: "interface{}"
          - name: "respBody"
            type: "interface{}"
        returns:
          - "error"
      - name: "Get"
        comment: "Get sends a GET request to the controller."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "apiPath"
            type: "string"
          - name: "reqBody"
            type: "interface{}"
          - name: "respBody"
            type: "interface{}"
        returns:
          - "error"
      - name: "Post"
        comment: "Post sends a POST request to the controller."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "apiPath"
            type: "string"
          - name: "reqBody"
            type: "interface{}"
          - name: "respBody"
            type: "interface{}"
        returns:
          - "error"
      - name: "Put"
        comment: "Put sends a PUT request to the controller."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "apiPath"
            type: "string"
          - name: "reqBody"
            type: "interface{}"
          - name: "respBody"
            type: "interface{}"
        returns:
          - "error"
      - name: "Delete"
        comment: "Delete sends a DELETE request to the controller."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "apiPath"
            type: "string"
          - name: "reqBody"
            type: "interface{}"
          - name: "respBody"
            type: "interface{}"
        returns:
          - "error"

      - name: "AdoptDevice"
        comment: "AdoptDevice adopts a device by MAC address."
        resourceName: "Device"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "mac"
            type: "string"
        returns:
          - "error"
      - name: "ForgetDevice"
        comment: "ForgetDevice forgets a device by MAC address."
        resourceName: "Device"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "mac"
            type: "string"
        returns:
          - "error"
      - name: "GetDeviceByMAC"
        resourceName: "Device"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "mac"
            type: "string"
        returns:
          - "*Device"
          - "error"
      - name: "ReorderFirewallRules"
        resourceName: "FirewallRule"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "ruleset"
            type: "string"
          - name: "reorder"
            type: "[]FirewallRuleIndexUpdate"
        returns:
          - "error"
      - name: "GetSetting"
        resourceName: "Setting"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "key"
            type: "string"
        returns:
          - "*Setting"
          - "interface{}"
          - "error"
      - name: "ListSites"
        resourceName: "Site"
        params:
          - name: "ctx"
            type: "context.Context"
        returns:
          - "[]Site"
          - "error"
      - name: "GetSite"
        resourceName: "Site"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "id"
            type: "string"
        returns:
          - "*Site"
          - "error"
      - name: "CreateSite"
        resourceName: "Site"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "description"
            type: "string"
        returns:
          - "[]Site"
          - "error"
      - name: "CreateSiteByModel"
        resourceName: "Site"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "d"
            type: "*Site"
        returns:
          - "*Site"
          - "error"
      - name: "DeleteSite"
        resourceName: "Site"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "id"
            type: "string"
        returns:
          - "[]Site"
          - "error"
      - name: "UpdateSite"
        resourceName: "Site"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "name"
            type: "string"
          - name: "description"
            type: "string"
        returns:
          - "[]Site"
          - "error"
      - name: "UpdateSiteByModel"
        resourceName: "Site"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "d"
            type: "*Site"
        returns:
          - "*Site"
          - "error"
      - name: "GetSystemInfo"
        resourceName: "SysInfo"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "id"
            type: "string"
        returns:
          - "*SysInfo"
          - "error"
      - name: "GetSystemInformation"
        resourceName: "SysInfo"
        returns:
          - "*SysInfo"
          - "error"
      - name: "GetUserByMAC"
        resourceName: "User"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "mac"
            type: "string"
        returns:
          - "*User"
          - "error"
      - name: "BlockUserByMAC"
        resourceName: "User"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "mac"
            type: "string"
        returns:
          - "error"
      - name: "UnblockUserByMAC"
        resourceName: "User"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "mac"
            type: "string"
        returns:
          - "error"
      - name: "DeleteUserByMAC"
        resourceName: "User"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "mac"
            type: "string"
        returns:
          - "error"
      - name: "KickUserByMAC"
        resourceName: "User"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "mac"
            type: "string"
        returns:
          - "error"
      - name: "OverrideUserFingerprint"
        resourceName: "User"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "mac"
            type: "string"
          - name: "devIdOverride"
            type: "int"
        returns:
          - "error"
      - name: "ListFirewallZoneMatrix"
        resourceName: "FirewallZoneMatrix"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
        returns:
          - "[]FirewallZoneMatrix"
          - "error"
      - name: "ListFeatures"
        resourceName: "DescribedFeature"
        comment: "ListFeatures returns all features of the UniFi controller."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
        returns:
          - "[]DescribedFeature"
          - "error"
      - name: "GetFeature"
        resourceName: "DescribedFeature"
        comment: "GetFeature returns a specific feature by it's name. Name is case-insensitive."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*DescribedFeature"
          - "error"
      - name: "IsFeatureEnabled"
        resourceName: "DescribedFeature"
        comment: "IsFeatureEnabled returns if a specific feature is enabled by it's name. Name is case-insensitive."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "bool"
          - "error"
      - name: "UploadPortalFile"
        resourceName: "PortalFile"
        comment: "UploadPortalFile uploads a Hotspot Portal file to the controller."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "filepath"
            type: "string"
        returns:
          - "*PortalFile"
          - "error"
      - name: "UploadPortalFileFromReader"
        resourceName: "PortalFile"
        comment: "UploadPortalFileFromReader uploads a Hotspot Portal file using io.Reader to the controller."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "reader"
            type: "io.Reader"
          - name: "filename"
            type: "string"
        returns:
          - "*PortalFile"
          - "error"
      - name: "DeletePortalFile"
        resourceName: "PortalFile"
        comment: "DeletePortalFile deletes a Hotspot Portal file from the controller."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "id"
            type: "string"
        returns:
          - "error"
      - name: "ListPortalFiles"
        resourceName: "PortalFile"
        comment: "ListPortalFiles lists all Hotspot Portal files on the controller."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
        returns:
          - "[]PortalFile"
          - "error"
      - name: "GetPortalFile"
        resourceName: "PortalFile"
        comment: "GetPortalFile returns a specific Hotspot Portal file by it's ID."
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "id"
            type: "string"
        returns:
          - "*PortalFile"
          - "error"
      - name: "GetAccountByName"
        resourceName: "Account"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*Account"
          - "error"
      - name: "GetAPGroupByName"
        resourceName: "APGroup"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*APGroup"
          - "error"
      - name: "GetBroadcastGroupByName"
        resourceName: "BroadcastGroup"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*BroadcastGroup"
          - "error"
      - name: "GetDashboardByName"
        resourceName: "Dashboard"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*Dashboard"
          - "error"
      - name: "GetDeviceByName"
        resourceName: "Device"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*Device"
          - "error"
      - name: "GetDHCPOptionByName"
        resourceName: "DHCPOption"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*DHCPOption"
          - "error"
      - name: "GetFirewallGroupByName"
        resourceName: "FirewallGroup"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*FirewallGroup"
          - "error"
      - name: "GetFirewallRuleByName"
        resourceName: "FirewallRule"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*FirewallRule"
          - "error"
      - name: "GetFirewallZonePolicyByName"
        resourceName: "FirewallZonePolicy"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*FirewallZonePolicy"
          - "error"
      - name: "GetFirewallZoneByName"
        resourceName: "FirewallZone"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*FirewallZone"
          - "error"
      - name: "GetHeatMapByName"
        resourceName: "HeatMap"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*HeatMap"
          - "error"
      - name: "GetHotspot2ConfByName"
        resourceName: "Hotspot2Conf"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*Hotspot2Conf"
          - "error"
      - name: "GetHotspotOpByName"
        resourceName: "HotspotOp"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*HotspotOp"
          - "error"
      - name: "GetHotspotPackageByName"
        resourceName: "HotspotPackage"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*HotspotPackage"
          - "error"
      - name: "GetMapByName"
        resourceName: "Map"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*Map"
          - "error"
      - name: "GetMediaFileByName"
        resourceName: "MediaFile"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*MediaFile"
          - "error"
      - name: "GetNetworkByName"
        resourceName: "Network"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*Network"
          - "error"
      - name: "GetPortForwardByName"
        resourceName: "PortForward"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*PortForward"
          - "error"
      - name: "GetPortProfileByName"
        resourceName: "PortProfile"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*PortProfile"
          - "error"
      - name: "GetRADIUSProfileByName"
        resourceName: "RADIUSProfile"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*RADIUSProfile"
          - "error"
      - name: "GetRoutingByName"
        resourceName: "Routing"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*Routing"
          - "error"
      - name: "GetScheduleTaskByName"
        resourceName: "ScheduleTask"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*ScheduleTask"
          - "error"
      - name: "GetSpatialRecordByName"
        resourceName: "SpatialRecord"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*SpatialRecord"
          - "error"
      - name: "GetTagByName"
        resourceName: "Tag"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*Tag"
          - "error"
      - name: "GetUserGroupByName"
        resourceName: "UserGroup"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*UserGroup"
          - "error"
      - name: "GetUserByName"
        resourceName: "User"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*User"
          - "error"
      - name: "GetWLANGroupByName"
        resourceName: "WLANGroup"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*WLANGroup"
          - "error"
      - name: "GetWLANByName"
        resourceName: "WLAN"
        params:
          - name: "ctx"
            type: "context.Context"
          - name: "site"
            type: "string"
          - name: "name"
            type: "string"
        returns:
          - "*WLAN"
          - "error"
  resources:
    Account:
      fields:
        IP:
          omitEmpty: true
        NetworkID:
          omitEmpty: true
    APGroup:
      resourcePath: "apgroups"
    ChannelPlan:
      fields:
        Channel:
          ifFieldType: "string"
          customUnmarshalType: "numberOrString"
        BackupChannel:
          ifFieldType: "string"
          customUnmarshalType: "numberOrString"
        TxPower:
          ifFieldType: "string"
          customUnmarshalType: "numberOrString"
    DNSRecord:
      resourcePath: "static-dns"
    DescribedFeature:
      resourcePath: "described-features?includeSystemFeatures=true" # TODO hack to get all features, because query params in requests are not yet supported
    Device:
      fields:
        _all:
          omitEmpty: true
        X:
          fieldType: "float64"
        Y:
          fieldType: "float64"
        StpPriority:
          fieldType: "string"
          customUnmarshalType: "numberOrString"
        Ht:
          fieldType: "int"
        Channel:
          customUnmarshalType: "numberOrString"
          ifFieldType: "string"
        BackupChannel:
          customUnmarshalType: "numberOrString"
          ifFieldType: "string"
        TxPower:
          customUnmarshalType: "numberOrString"
          ifFieldType: "string"
        LteExtAnt:
          customUnmarshalType: "booleanishString"
        LtePoe:
          customUnmarshalType: "booleanishString"
        PortOverrides:
          omitEmpty: false
    FirewallZone:
      resourcePath: "firewall/zone"
      fields:
        NetworkIDs:
          omitEmpty: false
    FirewallZoneMatrix:
      resourcePath: "firewall/zone-matrix"
    FirewallZonePolicy:
      resourcePath: "firewall-policies"
      fields:
        IPGroupID:
          omitEmpty: true
        PortGroupID:
          omitEmpty: true
        Date:
          fieldType: "string"
          customUnmarshalType: ""
        DateStart:
          fieldType: "string"
          customUnmarshalType: ""
        DateEnd:
          fieldType: "string"
          customUnmarshalType: ""
    Network:
      fields:
        InternetAccessEnabled:
          ifFieldType: "bool"
          customUnmarshalType: "*bool"
          customUnmarshalFunc: "emptyBoolToTrue"
        IntraNetworkAccessEnabled:
          ifFieldType: "bool"
          customUnmarshalType: "*bool"
          customUnmarshalFunc: "emptyBoolToTrue"
        IPV6Enabled:
          ifFieldType: "bool"
          customUnmarshalType: "*bool"
          customUnmarshalFunc: "emptyBoolToTrue"
        WANUsername:
          omitEmpty: true
        XWANPassword:
          omitEmpty: true
    SettingGuestAccess:
      fields:
        AllowedSubnet:
          jsonPath: "allowed_subnet"
        PortalCustomizedBgImageFilename:
          omitEmpty: false
        PortalCustomizedLogoFilename:
          omitEmpty: false
        RestrictedSubnet:
          jsonPath: "restricted_subnet"
        GoogleDomain:
          omitEmpty: false
        Expire:
          fieldType: "int"
          customUnmarshalType: "emptyStringInt"
        RestrictedDNSServers:
          omitEmpty: false
    SettingIps:
      fields:
        Honeypot:
          omitEmpty: false
    SettingMgmt:
      fields:
        AutoUpgradeHour:
          omitEmpty: false
        XSshKeys:
          omitEmpty: false
    SettingRsyslogd:
      fields:
        Contents:
          omitEmpty: false
        IP:
          omitEmpty: false
        NetconsoleHost:
          omitEmpty: false
    SettingUsg:
      fields:
        GeoIPFilteringCountries:
          omitEmpty: false
    User:
      fields:
        Blocked:
          fieldType: "bool"
        LastSeen:
          fieldType: "int"
          customUnmarshalType: "emptyStringInt"
    WLAN:
      fields:
        ScheduleWithDuration:
          omitEmpty: false
        PassphraseAutogenerated:
          ifFieldType: "bool"
          customUnmarshalType: "*bool"
          customUnmarshalFunc: "emptyBoolToTrue"
